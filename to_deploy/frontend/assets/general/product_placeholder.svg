<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#097e63" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="200" height="200" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="196" height="196" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" />
  
  <!-- Center Container Circle -->
  <circle cx="100" cy="90" r="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Shopping Bag / Fresh Product Icon -->
  <g transform="translate(100, 90) scale(1.15)">
    <!-- Bag / Basket Body -->
    <path d="M-18,-6 L18,-6 C20,-6 21.5,-4.5 21,-2.5 L17,19 C16.5,21.5 14.5,23 12,23 L-12,23 C-14.5,23 -16.5,21.5 -17,19 L-21,-2.5 C-21.5,-4.5 -20,-6 -18,-6 Z" fill="url(#iconGrad)" />
    <!-- Handle -->
    <path d="M-9,-6 C-9,-15 9,-15 9,-6" fill="none" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Fresh Leaf Accent -->
    <path d="M0,0 C6,-5 12,-1 11,5 C5,10 0,6 0,0 Z" fill="#34d399" />
  </g>
  
  <!-- Label Text -->
  <text x="100" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.3">TomorrowNeeds</text>
  <text x="100" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">Fresh &amp; Daily</text>
</svg>
