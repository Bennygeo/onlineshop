<div class="products-module-wrapper">
  <!-- Module Main Header -->
  <div class="module-header">
    <div class="header-titles">
      <div class="icon-badge">
        <span class="material-icons">inventory_2</span>
      </div>
      <div>
        <h2>Products & Inventory Management</h2>
        <p>Manage product catalog, prices, categories, inventory stock, and bulk Excel imports</p>
      </div>
    </div>
  </div>

  <!-- Sub Navigation Tabs Bar -->
  <nav class="products-sub-tabs">
    <a routerLink="/admin/products/list" routerLinkActive="active" class="sub-tab-item">
      <span class="material-icons">list_alt</span>
      <span class="tab-label">All Products</span>
    </a>

    <a routerLink="/admin/products/add" routerLinkActive="active" class="sub-tab-item">
      <span class="material-icons">add_circle_outline</span>
      <span class="tab-label">Add Product</span>
    </a>

    <a routerLink="/admin/products/categories" routerLinkActive="active" class="sub-tab-item">
      <span class="material-icons">category</span>
      <span class="tab-label">Manage Categories</span>
    </a>

    <a routerLink="/admin/products/bulk" routerLinkActive="active" class="sub-tab-item">
      <span class="material-icons">upload_file</span>
      <span class="tab-label">Bulk Upload / Update</span>
      <span class="badge-excel">Excel</span>
    </a>
  </nav>

  <!-- Routed Sub-Page Outlet -->
  <div class="sub-page-outlet-container">
    <router-outlet></router-outlet>
  </div>
</div>
