  <title>Thinkspot-referral&share</title>
  <style>
    body,
    html {
      background: transparent;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* container */
    #share {
      width: 100%;
      margin: 36px auto;
      text-align: center;
    }

    /* buttons */

    #share a,
    #share button {
      width: 40px;
      height: 40px;
      display: inline-block;
      margin: 8px;
      border-radius: 50%;
      font-size: 20px;
      color: #fff;
      opacity: 0.75;
      transition: opacity 0.15s linear;
    }

    #share a:hover,
    #share button:hover {
      opacity: 1;
    }

    /* icons */

    #share i {
      position: relative;
      transform: translateY(-77%);
    }

    .sharer {
      border: none;
      line-height: 70px;
      outline: none;
    }

    /* colors */

    .facebook {
      background: #3b5998;
    }

    .twitter {
      background: #55acee;
    }

    .googleplus {
      background: #dd4b39;
    }

    .linkedin {
      background: #0077b5;
    }

    .whatsapp_cs {
      background: #00b536;
    }

    .email {
      background: #dd4b39;
    }

    .pinterest {
      background: #cb2027;
    }
  </style>

<body cz-shortcut-listen="true">

  <script>
    var params = location.href.split('?')[1].split('&');
    var url = "https://www.thinkspot.in/newux/";

    data = {};
    for (x in params) {
      data[params[x].split('=')[0]] = params[x].split('=')[1];
    }

    var txt =
      "Hey, looking for a cool solution that delivers all your natural food needs absolutely fresh.\n\nAnd here's more; get 5% off on your next 5 purchases of vegetables.\n\nDownload the app: https://thinkspot.in/app \n\nUse code: " +
      data['id'] + "\n\n(or)\n\n";

    window.onload = function () {
      var ids = ["twitter", "fb", "linkedin", "whatsapp", "email"];

      for (var i = 0; i < ids.length; i++) {
        var fb = document.getElementById(ids[i]);
        // debugger;
        fb.setAttribute('data-url', url + '?id=' + data.id + '&type=' + data.type);
        fb.setAttribute('data-image', "<img src='../assets/home/logo_wo.svg' />");
        fb.setAttribute('data-title', txt);
        // console.log("_____________");
      }
    }

  </script>
